# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "avw3VKE2q9ustAyKfQGh"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------
[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for
# constructing URLs used in emails.
site_url = "http://localhost:3000"
# Exact URLs that auth providers are permitted to redirect to post-authentication.
# Includes local development and the staging environment.
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "https://staging.example.com/**",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour).
# Set to 1 hour — short-lived for security; refresh token rotation keeps
# sessions alive transparently.
jwt_expiry = 3600
# Rotate refresh tokens on every use to detect token theft.
enable_refresh_token_rotation = true
# Allow a 10-second grace window so that concurrent requests using the same
# refresh token do not accidentally invalidate each other.
refresh_token_reuse_interval = 10
# Allow new user signups.
enable_signup = true
# Anonymous sign-ins are disabled; all users must authenticate.
enable_anonymous_sign_ins = false
# Manual account linking is disabled by default.
enable_manual_linking = false
# Minimum accepted password length (NIST recommends ≥ 8).
minimum_password_length = 8
# Require at least one uppercase letter, one lowercase letter, and one digit.
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# Emails per hour (increase in production via SMTP settings).
email_sent = 2
# SMS messages per hour.
sms_sent = 30
# Anonymous sign-ins per hour per IP.
anonymous_users = 30
# Session refreshes per 5-minute window per IP.
token_refresh = 150
# Sign-up / sign-in requests per 5-minute window per IP.
sign_in_sign_ups = 30
# OTP / magic-link verifications per 5-minute window per IP.
token_verifications = 30
web3 = 30

# ---------------------------------------------------------------------------
# Email / password auth
# ---------------------------------------------------------------------------
[auth.email]
# Enable email/password sign-ups.
enable_signup = true
# Require users to confirm their email address before they can sign in.
enable_confirmations = true
# Require confirmation on both old and new addresses when changing email.
double_confirm_changes = true
# Require recent authentication before changing a password.
secure_password_change = true
# Minimum interval between confirmation/reset emails to prevent abuse.
max_frequency = "1s"
# 6-digit OTP codes in confirmation emails.
otp_length = 6
# OTP codes expire after 1 hour.
otp_expiry = 3600

# Production SMTP — values supplied via environment variables so no secrets
# are committed to source control.
[auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "env(SMTP_ADMIN_EMAIL)"
sender_name = "env(SMTP_SENDER_NAME)"

# ---------------------------------------------------------------------------
# Google OAuth provider
# ---------------------------------------------------------------------------
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
# DO NOT commit your OAuth secret to git. Supply via environment variable.
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# Redirect URI registered in the Google Cloud Console.
# Leave empty to use Supabase's default callback URL.
redirect_uri = ""
# Skip nonce check for local development with Google auth.
skip_nonce_check = false

# ---------------------------------------------------------------------------
# GitHub OAuth provider
# ---------------------------------------------------------------------------
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
# DO NOT commit your OAuth secret to git. Supply via environment variable.
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
# Redirect URI registered in the GitHub OAuth App settings.
# Leave empty to use Supabase's default callback URL.
redirect_uri = ""

# ---------------------------------------------------------------------------
# SMS (disabled — not required for this project)
# ---------------------------------------------------------------------------
[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# ---------------------------------------------------------------------------
# MFA (disabled by default — enable per-plan)
# ---------------------------------------------------------------------------
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# ---------------------------------------------------------------------------
# Auth hook: runs before a token is issued (custom claims, etc.)
# ---------------------------------------------------------------------------
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
